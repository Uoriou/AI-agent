version: '3.9'

services:
  python-backend:
    build: ./app/backend
    container_name: ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
    env_file:
      - .env

  
  # React Dev mode service for development
  node-frontend-dev:
    build: ./app/vite_app
    container_name: ai-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./app/vite_app:/app  
      - /app/node_modules 
    # run separately with `docker-compose run node-frontend-dev ` to start the dev server

  node-frontend:
    build:
      context: ./app
      dockerfile: vite_app/Dockerfile
    container_name: ai-frontend
    ports:
      - "80:80"
    depends_on:
      - python-backend
    env_file:
      - .env